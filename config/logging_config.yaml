# Logging Configuration

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/retailpulse.log
    maxBytes: 10485760
    backupCount: 5

loggers:
  retailpulse:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  pyspark:
    level: WARN
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]