services:
  postgres_ops:
    image: postgres:15-alpine
    container_name: retailpulse-postgres-ops
    environment:
      POSTGRES_DB: retail_ops
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_ops_data:/var/lib/postgresql/data
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_dw:
    image: postgres:15-alpine
    container_name: retailpulse-postgres-dw
    environment:
      POSTGRES_DB: retail_dw
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retailpulse-redis
    ports:
      - "6379:6379"
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock_api:
    image: python:3.11-slim
    container_name: retailpulse-mock-api
    ports:
      - "5000:5000"
    volumes:
      - ./mock_api:/app
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    command: >
      sh -c "pip install flask flask-cors -q && python app.py"
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_ops_data:
  postgres_dw_data:

networks:
  retailpulse_network:
    driver: bridge