Set-Content -Path "docker-compose.yml" -Value 'version: "3.8"

services:
  postgres_ops:
    image: postgres:15-alpine
    container_name: retailpulse-postgres-ops
    environment:
      POSTGRES_DB: retail_ops
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_ops_data:/var/lib/postgresql/data
      - ./warehouse/ddl/01_create_operational_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_dw:
    image: postgres:15-alpine
    container_name: retailpulse-postgres-dw
    environment:
      POSTGRES_DB: retail_dw
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
      - ./warehouse/ddl:/docker-entrypoint-initdb.d
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retailpulse-redis
    ports:
      - "6379:6379"
    networks:
      - retailpulse_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    image: bitnami/spark:3.5.0
    container_name: retailpulse-spark-master
    ports:
      - "8081:8080"
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    volumes:
      - ./data:/opt/spark/data
      - ./pyspark:/opt/spark/jobs
      - ./config:/opt/spark/config
    command: /opt/bitnami/spark/sbin/start-master.sh
    networks:
      - retailpulse_network

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: retailpulse-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./data:/opt/spark/data
      - ./pyspark:/opt/spark/jobs
      - ./config:/opt/spark/config
    command: /opt/bitnami/spark/sbin/start-worker.sh
    networks:
      - retailpulse_network

volumes:
  postgres_ops_data:
  postgres_dw_data:

networks:
  retailpulse_network:
    driver: bridge'